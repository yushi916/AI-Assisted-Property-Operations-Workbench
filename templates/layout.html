<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ page_title }} · 物业运营助手{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/workbench.css') }}?v=execution-layout-1">
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <header class="site-header">
        <nav class="site-nav" aria-label="主导航">
            <a class="brand" href="{{ url_for('reports_page') }}">物业运营助手</a>
            <div class="nav-links">
                <a href="{{ url_for('reports_page') }}"{% if active_nav == 'reports' %} aria-current="page"{% endif %}>报事处理</a>
                <a href="{{ url_for('plans_page') }}"{% if active_nav == 'plans' %} aria-current="page"{% endif %}>工作计划</a>
            </div>
            <span class="demo-label">虚构案例演示</span>
        </nav>
    </header>
    <div class="workspace">
        <main id="main-content">
            {% block content %}{% endblock %}
        </main>
        <aside class="sidebar" aria-label="工作导航">
            {% block sidebar %}
            <section class="panel">
                <h2>工作入口</h2>
                <nav class="sidebar-links" aria-label="快捷入口">
                    <a href="{{ url_for('home') }}">录入新报事</a>
                    <a href="{{ url_for('reports_page') }}">查看报事列表</a>
                    <a href="{{ url_for('plans_page') }}">录入或查看工作计划</a>
                </nav>
            </section>
            <section class="panel">
                <h2>核查提示</h2>
                <p class="muted">先看居民描述，再查看相关工作计划和处理记录；需要时可选择计划或生成建议。</p>
                <p class="muted">AI 草稿依据生成时的证据，仍需人员核实。</p>
            </section>
            {% endblock %}
        </aside>
    </div>
    <footer class="site-footer">物业运营助手 · 本地原型</footer>
    {% block scripts %}{% endblock %}
</body>
</html>
